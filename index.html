<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/open-ev-data-sustainability/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn OpenEV Data specifications into real-world energy use: consumption, charging time, running costs and energy technologies for any electric vehicle."
    />
    <meta name="color-scheme" content="dark light" />
    <title>OpenEV Data Sustainability</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('oev_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script>
      (function () {
        var l = window.location;
        var search = l.search;
        if (search && search.indexOf('?p=/') === 0) {
          var parts = search.slice(1).split('&q=');
          var path = parts[0].slice(2).replace(/~and~/g, '&');
          var query = parts[1] ? '?' + parts[1].replace(/~and~/g, '&') : '';
          var base = l.pathname.replace(/\/$/, '');
          window.history.replaceState(null, null, base + '/' + path + query + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

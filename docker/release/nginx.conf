server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /open-ev-data-sustainability/;
    }

    location /open-ev-data-sustainability/ {
        try_files $uri $uri/ /open-ev-data-sustainability/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
